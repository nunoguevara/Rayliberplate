name: MacOS Build Test

on:
  push:

jobs:
  build:
    name: MacOS test, ${{ matrix.compiler }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
          compiler: [gcc, clang]
      
    steps:
      - name : Check out repository
        uses : actions/checkout@v4

      - name: Compiler installation
        run: brew install ${{ matrix.compiler }}

      - name: Installing and building raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build -DBUILD_SHARED_LIBS=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build raylib/build
          cmake --install raylib/build
          
      - name: Checking if raylib is installed
        run: |
          brew list --formula raylib

      - name : Configuring Rayliberplate
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SHARED_LIBS=ON

      - name : Building and installing Rayliberplate
        run: |
          cmake --build build
          cmake --install build
