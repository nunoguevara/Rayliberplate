name: Build Workflow

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Ubuntu test, ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
          compiler: [gcc, clang]
      
    steps:
      - name : Check out repository
        uses : actions/checkout@v4

      - name: Compiler installation
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}

      - name: Linux dependencies installation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev
            
      - name: Setting up sandbox folder
        run: | 
          mkdir "$HOME/sandbox"
        
      - name: Installing and building raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_INSTALL_PREFIX="$HOME/sandbox"
          cmake --build raylib/build
          cmake --install raylib/build

      - name : Configuring Rayliberplate
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/sandbox"

      - name : Building and installing Rayliberplate
        run: |
          cmake --build build
          cmake --install build

      - name : Building the test program
        run : |
          cd tests/consumer
          cmake -S . -B consumer-build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$HOME/sandbox"
          cmake --build consumer-build
          cmake --install consumer-build
          
      - name : Running the test program
        uses: GabrielBB/xvfb-action@v1
        with: 
          run : |
            export PATH="$HOME/sandbox/bin:$PATH"
            LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$HOME/sandbox/lib" consumer
            
  build-mac:
    name: MacOS test, clang
    runs-on: macos-latest

    strategy:
      fail-fast: false
  
    steps:
      - name : Check out repository
        uses : actions/checkout@v4

      - name: Installing raylib
        run: brew install raylib
          
      - name: Checking if raylib is installed
        run: |
          brew list --formula raylib

      - name : Configuring Rayliberplate
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON

      - name : Building and installing Rayliberplate
        run: |
          cmake --build build
          sudo cmake --install build  

